services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rendezvous}
      POSTGRES_USER: ${POSTGRES_USER:-rendezvous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: src/Rendezvous.Api/Dockerfile
      target: migrate
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-rendezvous};Username=${POSTGRES_USER:-rendezvous};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Jwt__Issuer: ${JWT_ISSUER:-Rendezvous.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Rendezvous.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Email__Provider: ${EMAIL_PROVIDER:-Disabled}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Rendezvous}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Media__UploadRoot: /var/lib/rendezvous/uploads
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/Rendezvous.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-rendezvous};Username=${POSTGRES_USER:-rendezvous};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Jwt__Issuer: ${JWT_ISSUER:-Rendezvous.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Rendezvous.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Email__Provider: ${EMAIL_PROVIDER:-Disabled}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Rendezvous}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Media__UploadRoot: /var/lib/rendezvous/uploads
    volumes:
      - media-uploads:/var/lib/rendezvous/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: src/Rendezvous.Web
      args:
        RENDEZVOUS_API_BASE_URL: ${RENDEZVOUS_API_BASE_URL:-http://api:8080}
    restart: unless-stopped
    environment:
      RENDEZVOUS_API_BASE_URL: ${RENDEZVOUS_API_BASE_URL:-http://api:8080}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  media-uploads:
